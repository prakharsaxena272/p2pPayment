# App server port
server.port=8084

# MySQL Connection URL: Corrected to port 3306 and enabling SSL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/userdb?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=true
spring.datasource.username=root
spring.datasource.password=

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true